[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-obb-annotator"
version = "0.1.0"
description = "Desktop YOLO OBB/HBB auto annotation with SAM3 and MobileSAM"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "Pillow>=10,<13",
    "PyQt5>=5.15,<6",
    "timm>=1.0,<2",
    "torch>=2.1",
    "ultralytics>=8.4.38,<9",
]

[project.scripts]
auto-obb-annotator = "auto_obb_annotator.__main__:main"

[tool.setuptools.packages.find]
include = ["auto_obb_annotator*"]
